name: CI

on:
  push:
    branches: [main]
  pull_request:

# 四道关：① 语法与清单 ② 版本号一致 ③ skill 信封校验 ④ fixture 跑真流程
# 第 ④ 道是关键：1.4.4 修的那批真 bug（未定义变量、断言恒真、pagemap 掐断 && 链）
# 全都是 ①②③ 抓不到的——只有真跑一遍 pipeline 才会现形。
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 全部脚本语法检查
        run: |
          for f in fandex/skills/fandex/scripts/*.js \
                   fandex/skills/fandex/evals/*.js; do
            echo "check $f"
            node --check "$f"
          done
      - name: 校验插件清单为合法 JSON
        run: |
          node -e "for (const p of ['.claude-plugin/marketplace.json','fandex/.claude-plugin/plugin.json','fandex/.zcode-plugin/plugin.json','fandex/skills/fandex/scripts/package.json']) { JSON.parse(require('fs').readFileSync(p,'utf8')); console.log('OK', p); }"
      - name: 校验版本号一致（单一事实源：scripts/sync_version.js）
        run: node fandex/skills/fandex/scripts/sync_version.js --check
      - name: 校验 skill 信封（frontmatter / 引用完整性 / 文档数字与代码是否一致）
        run: node fandex/skills/fandex/evals/lint_skill.js
      - name: 信封卫生（本机配置与依赖不得入库）
        run: |
          bad=$(git ls-files | grep -E '(^|/)node_modules/|(^|/)config\.json$' || true)
          if [ -n "$bad" ]; then
            echo "::error::skill 信封里不该出现这些（本机配置 / 依赖）："; echo "$bad"; exit 1
          fi
          test -f fandex/skills/fandex/scripts/config.example.json || { echo "::error::config.example.json 丢了"; exit 1; }
          echo "✓ 信封干净：无 node_modules、无 config.json（模板 config.example.json 在位）"

  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 装脚本依赖（含 Chromium）
        working-directory: fandex/skills/fandex/scripts
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: 装字体子集工具
        run: python -m pip install fonttools brotli

      - name: 准备 fixture 项目根（含程序生成的测试字体）
        run: |
          SKILL="$PWD/fandex/skills/fandex"
          ROOT="$RUNNER_TEMP/acb-eval"
          rm -rf "$ROOT" && mkdir -p "$ROOT"
          cp -r "$SKILL/evals/fixture/." "$ROOT/"
          # 用现场生成的极小测试字体代替霞鹜文楷：CI 不下载 20MB 正版字体，
          # 但"字体子集化 → 构建 → 渲染 → 页码反查"这条链一步都不少。
          python "$SKILL/evals/make_smoke_font.py" "$ROOT/fonts"
          echo "ACB_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "ACB_SKILL=$SKILL" >> "$GITHUB_ENV"

      - name: 模式 A 合成 + 两轮 pipeline
        working-directory: fandex/skills/fandex/scripts
        env:
          ANIME_BOOK_ROOT: ${{ env.ACB_ROOT }}
          ANIME_BOOK_FONT_REGULAR: ${{ env.ACB_ROOT }}/fonts/Smoke-Regular.ttf
          ANIME_BOOK_FONT_MEDIUM: ${{ env.ACB_ROOT }}/fonts/Smoke-Medium.ttf
        run: |
          node names_to_base.js
          npm run pipeline

      - name: 产物断言 + 数据审计（并留下收据）
        working-directory: fandex/skills/fandex/scripts
        env:
          ANIME_BOOK_ROOT: ${{ env.ACB_ROOT }}
        run: |
          npm run check
          # audit 对 fixture 是"建议性"的：测试小作品本来就只有必填字段
          npm run audit || true
          echo "--- 收据 ---"
          node -e "const c=require(process.env.ANIME_BOOK_ROOT+'/anime_build/_check.json');console.log('check',JSON.stringify(c.counts),JSON.stringify(c.failures))"

      - name: 负向测试 ① 封面缺失必须被抓住
        working-directory: fandex/skills/fandex/scripts
        env:
          ANIME_BOOK_ROOT: ${{ env.ACB_ROOT }}
        run: |
          mv "$ANIME_BOOK_ROOT/anime_research/covers/测试小作品.jpg" "$RUNNER_TEMP/cover.bak"
          set +e
          npm run check > "$RUNNER_TEMP/negative1.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/negative1.log"
          mv "$RUNNER_TEMP/cover.bak" "$ANIME_BOOK_ROOT/anime_research/covers/测试小作品.jpg"
          if [ "$code" -eq 0 ]; then echo "::error::封面缺失时 check 竟然通过了"; exit 1; fi
          grep -q '\[C7\]' "$RUNNER_TEMP/negative1.log" || { echo "::error::失败信息里没有 [C7]"; exit 1; }
          echo "✓ 封面缺失 → check 失败并报 [C7]"

      - name: 负向测试 ② 页码未收敛必须被抓住
        working-directory: fandex/skills/fandex/scripts
        env:
          ANIME_BOOK_ROOT: ${{ env.ACB_ROOT }}
        run: |
          cp "$ANIME_BOOK_ROOT/anime_build/_pagemap.prev.json" "$RUNNER_TEMP/prev.bak"
          node -e "const f=process.env.ANIME_BOOK_ROOT+'/anime_build/_pagemap.prev.json';const m=JSON.parse(require('fs').readFileSync(f,'utf8'));const k=Object.keys(m)[0];m[k]=m[k]+1;require('fs').writeFileSync(f,JSON.stringify(m))"
          set +e
          npm run check > "$RUNNER_TEMP/negative2.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/negative2.log"
          cp "$RUNNER_TEMP/prev.bak" "$ANIME_BOOK_ROOT/anime_build/_pagemap.prev.json"
          if [ "$code" -eq 0 ]; then echo "::error::页码漂移时 check 竟然通过了"; exit 1; fi
          grep -q '\[C12\]' "$RUNNER_TEMP/negative2.log" || { echo "::error::失败信息里没有 [C12]"; exit 1; }
          echo "✓ 页码漂移 → check 失败并报 [C12]"

      - name: 负向测试 ③ 交付诚实性（无收据 / 未声明必须被标注）
        working-directory: fandex/skills/fandex/scripts
        env:
          ANIME_BOOK_ROOT: ${{ env.ACB_ROOT }}
        run: |
          npm run check >/dev/null
          mv "$ANIME_BOOK_ROOT/anime_build/_check.json" "$RUNNER_TEMP/check.bak"
          node pack.js --out "$RUNNER_TEMP/pack-noreceipt" >/dev/null
          grep -q '无收据' "$RUNNER_TEMP/pack-noreceipt/交付说明.md" || { echo "::error::缺收据时交付说明没有标注"; exit 1; }
          grep -q '未声明' "$RUNNER_TEMP/pack-noreceipt/交付说明.md" || { echo "::error::未签署目检时没有标注未声明"; exit 1; }
          mv "$RUNNER_TEMP/check.bak" "$ANIME_BOOK_ROOT/anime_build/_check.json"
          node pack.js --out "$RUNNER_TEMP/pack-signed" --pages-reviewed --covers-reviewed >/dev/null
          grep -q '已声明由 agent 逐页看过' "$RUNNER_TEMP/pack-signed/交付说明.md" || { echo "::error::签署后没有记录声明"; exit 1; }
          echo "✓ 交付说明如实反映核验状态（缺收据 / 未声明 / 已声明三种都验过）"

      # ---- 以下几条对应 2026-10 审计发现的真实缺陷（每条都先复现过）----

      - name: 负向测试 ④ 书名与某部作品名相同时，目录页码不得取到前置页
        working-directory: fandex/skills/fandex/scripts
        env:
          ANIME_BOOK_ROOT: ${{ env.ACB_ROOT }}
          ANIME_BOOK_TITLE: 星海旅人
          # CI 用程序生成的测试字体，靠环境变量传入（fonts/ 里没有真字体）——漏了这行会让 pipeline 直接失败
          ANIME_BOOK_FONT_REGULAR: ${{ env.ACB_ROOT }}/fonts/Smoke-Regular.ttf
          ANIME_BOOK_FONT_MEDIUM: ${{ env.ACB_ROOT }}/fonts/Smoke-Medium.ttf
        run: |
          # 曾经的 bug：总览页标题也是 h1 → 生成同名书签 → pagemap 取最小页 →
          # 目录把该章页码印成总览页页码（实测印 002，该章实际在第 4 页），且 16 条断言全绿。
          npm run pipeline >/dev/null
          node -e "const m=require(process.env.ANIME_BOOK_ROOT+'/anime_build/_pagemap.json');const p=m['星海旅人'];if(!(p>2)){console.error('::error::书名=作品名时页码取到了前置页：'+p);process.exit(1)}console.log('✓ 页码 =',p)"
          # [C17] 必须绿：书签里不能有重复的"当键用"标题
          npm run check >/dev/null || { echo "::error::书名=作品名时 check 未全绿"; exit 1; }
          # [C18] 负向：把数说页统计文字从 HTML 删掉，check 必须失败并报 [C18]（防新断言恒真）
          H="$ANIME_BOOK_ROOT/anime_build/$ANIME_BOOK_TITLE.html"
          cp "$H" "$RUNNER_TEMP/book.html"
          node -e "const fs=require('fs');const f=process.env.ANIME_BOOK_ROOT+'/anime_build/'+process.env.ANIME_BOOK_TITLE+'.html';let t=fs.readFileSync(f,'utf8');t=t.split('单元构成').join('');fs.writeFileSync(f,t)"
          set +e
          node ../evals/check.js > "$RUNNER_TEMP/negative4c.log" 2>&1
          code=$?
          set -e
          cp "$RUNNER_TEMP/book.html" "$H"
          cat "$RUNNER_TEMP/negative4c.log"
          if [ "$code" -eq 0 ]; then echo "::error::删掉数说页统计后 check 竟然通过了（[C18] 形同虚设）"; exit 1; fi
          grep -q '\[C18\]' "$RUNNER_TEMP/negative4c.log" || { echo "::error::失败信息里没有 [C18]"; exit 1; }
          echo "✓ 书名撞作品名 → 页码正确且 [C17] 无重复书签；[C18] 缺失能被抓住"

      - name: 负向测试 ④b [C17] 必须能抓到重复书签（防新断言恒真）
        working-directory: fandex/skills/fandex/scripts
        env:
          ANIME_BOOK_ROOT: ${{ env.ACB_ROOT }}
        run: |
          R="$ANIME_BOOK_ROOT/anime_build/_pdfprobe.json"
          cp "$R" "$RUNNER_TEMP/probe.real"
          node -e "const fs=require('fs'),f=process.env.ANIME_BOOK_ROOT+'/anime_build/_pdfprobe.json';const r=JSON.parse(fs.readFileSync(f,'utf8'));r.duplicateOutlineTitles=['星海旅人'];fs.writeFileSync(f,JSON.stringify(r,null,1))"
          set +e
          node ../evals/check.js > "$RUNNER_TEMP/negative4b.log" 2>&1
          code=$?
          set -e
          cp "$RUNNER_TEMP/probe.real" "$R"
          cat "$RUNNER_TEMP/negative4b.log"
          if [ "$code" -eq 0 ]; then echo "::error::注入重复书签后 check 竟然通过了（[C17] 形同虚设）"; exit 1; fi
          grep -q '\[C17\]' "$RUNNER_TEMP/negative4b.log" || { echo "::error::失败信息里没有 [C17]"; exit 1; }
          echo "✓ 重复书签 → check 失败并报 [C17]"

      - name: 恢复默认书名与收据
        working-directory: fandex/skills/fandex/scripts
        env:
          ANIME_BOOK_ROOT: ${{ env.ACB_ROOT }}
          ANIME_BOOK_FONT_REGULAR: ${{ env.ACB_ROOT }}/fonts/Smoke-Regular.ttf
          ANIME_BOOK_FONT_MEDIUM: ${{ env.ACB_ROOT }}/fonts/Smoke-Medium.ttf
        run: |
          # ④/④b 期间换过书名、动过探针收据；恢复成默认状态，避免污染后续 pack 用例
          # （pack 现在会校验 root/书名/PDF 哈希，收据不对会直接判"不属于本产物"）
          npm run pipeline >/dev/null
          npm run check >/dev/null
          npm run audit >/dev/null || true
          # 恢复默认书名并重生成收据，避免污染后续步骤（pack 现在会校验收据属于本产物）
          unset ANIME_BOOK_TITLE
          npm run pipeline >/dev/null
          npm run check >/dev/null
          npm run audit >/dev/null || true

      - name: 负向测试 ⑤ --force 不得删除用户目录里的非本工具文件
        working-directory: fandex/skills/fandex/scripts
        env:
          ANIME_BOOK_ROOT: ${{ env.ACB_ROOT }}
        run: |
          D="$RUNNER_TEMP/user-dir"
          rm -rf "$D" && mkdir -p "$D"
          echo "私人内容" > "$D/私人文件.txt"
          set +e
          node pack.js --out "$D" --force > "$RUNNER_TEMP/negative5.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/negative5.log" || true
          test -f "$D/私人文件.txt" || { echo "::error::--force 删掉了非本工具文件（数据丢失）"; exit 1; }
          test "$code" -ne 0 || { echo "::error::非本工具目录竟然打包成功了"; exit 1; }
          echo "✓ 非本工具目录被拒绝，用户文件完好无损"

      - name: 负向测试 ⑥ 交付包不得含本机绝对路径（台账泄漏）
        working-directory: fandex/skills/fandex/scripts
        env:
          ANIME_BOOK_ROOT: ${{ env.ACB_ROOT }}
        run: |
          # 曾经的 bug：sources 默认只 list 不产文件（死循环），而它写出的台账第一行是「项目根：<绝对路径>」
          npm run sources >/dev/null
          test -f "$ANIME_BOOK_ROOT/anime_build/_sources.md" || { echo "::error::npm run sources 仍未产出台账（默认应为 report）"; exit 1; }
          node pack.js --out "$RUNNER_TEMP/pack-privacy" >/dev/null
          # 只扫文本类文件：封面图是二进制，grep -r 可能在随机字节上误报，导致这条 gate 变得不稳定
          TEXT=(--include='*.md' --include='*.html' --include='*.json' --include='*.txt')
          if grep -rqF "${TEXT[@]}" "$ANIME_BOOK_ROOT" "$RUNNER_TEMP/pack-privacy/"; then
            echo "::error::交付包含本机绝对路径："; grep -rnF "${TEXT[@]}" "$ANIME_BOOK_ROOT" "$RUNNER_TEMP/pack-privacy/" | head -5; exit 1
          fi
          if grep -rqE "${TEXT[@]}" '/home/runner|[A-Za-z]:\\+Users' "$RUNNER_TEMP/pack-privacy/"; then
            echo "::error::交付包含疑似本机路径"; grep -rnE '/home/runner|[A-Za-z]:\\+Users' "$RUNNER_TEMP/pack-privacy/" | head -5; exit 1
          fi
          echo "✓ 台账已产出，且交付包内无本机绝对路径"

      - name: 负向测试 ⑦ 伪造/串项目的收据不得被标成"全部通过"
        working-directory: fandex/skills/fandex/scripts
        env:
          ANIME_BOOK_ROOT: ${{ env.ACB_ROOT }}
        run: |
          R="$ANIME_BOOK_ROOT/anime_build/_check.json"
          cp "$R" "$RUNNER_TEMP/check.real"
          node -e "const fs=require('fs'),f=process.env.ANIME_BOOK_ROOT+'/anime_build/_check.json';const r=JSON.parse(fs.readFileSync(f,'utf8'));r.root='D:\\\\other-person\\\\project';r.book='别人的书';if(r.artifacts)r.artifacts.pdf='deadbeef';fs.writeFileSync(f,JSON.stringify(r,null,1))"
          node pack.js --out "$RUNNER_TEMP/pack-forged" >/dev/null
          grep -q '不属于本产物' "$RUNNER_TEMP/pack-forged/交付说明.md" || {
            echo "::error::串项目的收据被当成了本产物的核验凭据："; grep -n '产物断言' "$RUNNER_TEMP/pack-forged/交付说明.md"; exit 1
          }
          cp "$RUNNER_TEMP/check.real" "$R"
          echo "✓ 收据与产物（root/书名/PDF 哈希）绑定校验生效"

      - name: 准备 novel fixture 项目根（第二领域包）
        run: |
          SKILL="$PWD/fandex/skills/fandex"
          ROOT="$RUNNER_TEMP/acb-novel"
          rm -rf "$ROOT" && mkdir -p "$ROOT/fonts"
          cp -r "$SKILL/evals/fixture-novel/." "$ROOT/"
          python "$SKILL/evals/make_smoke_font.py" "$ROOT/fonts"
          echo "ACB_NOVEL_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: novel 领域包必须跑通且 check 全绿
        working-directory: fandex/skills/fandex/scripts
        env:
          ANIME_BOOK_ROOT: ${{ env.ACB_NOVEL_ROOT }}
          ANIME_BOOK_DOMAIN: novel
          ANIME_BOOK_TITLE: 设定集冒烟
          ANIME_BOOK_FONT_REGULAR: ${{ env.ACB_NOVEL_ROOT }}/fonts/Smoke-Regular.ttf
          ANIME_BOOK_FONT_MEDIUM: ${{ env.ACB_NOVEL_ROOT }}/fonts/Smoke-Medium.ttf
        run: |
          # 回归保护：novel 在文档里是一等公民，但此前 CI 从没跑过它——
          # 结果就是 [C7] 与 domain-novel.md「cover 无也可」长期打架而无人发现。
          npm run base
          npm run pipeline
          npm run check
          npm run audit || true
          echo "✓ novel 跑通；角色未声明 cover 按设计降级，不再判 [C7] 失败"

      - name: 负向测试 ⑧ novel 下「声明了 cover 却缺文件」仍必须被抓住
        working-directory: fandex/skills/fandex/scripts
        env:
          ANIME_BOOK_ROOT: ${{ env.ACB_NOVEL_ROOT }}
          ANIME_BOOK_DOMAIN: novel
          ANIME_BOOK_TITLE: 设定集冒烟
          ANIME_BOOK_FONT_REGULAR: ${{ env.ACB_NOVEL_ROOT }}/fonts/Smoke-Regular.ttf
          ANIME_BOOK_FONT_MEDIUM: ${{ env.ACB_NOVEL_ROOT }}/fonts/Smoke-Medium.ttf
        run: |
          J="$ANIME_BOOK_ROOT/anime_research/沈观澜.json"
          cp "$J" "$RUNNER_TEMP/shen.bak"
          node -e "const fs=require('fs');const p=process.env.ANIME_BOOK_ROOT+'/anime_research/沈观澜.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.cover='covers/不存在.jpg';fs.writeFileSync(p,JSON.stringify(j,null,1))"
          set +e
          npm run check > "$RUNNER_TEMP/negative8.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/negative8.log"
          cp "$RUNNER_TEMP/shen.bak" "$J"
          if [ "$code" -eq 0 ]; then echo "::error::novel 下声明了不存在的 cover，check 竟然通过了"; exit 1; fi
          grep -q '\[C7\]' "$RUNNER_TEMP/negative8.log" || { echo "::error::失败信息里没有 [C7]"; exit 1; }
          echo "✓ 放宽只对「未声明 cover」生效；「声明了却缺文件」仍被 [C7] 拦住"

  # Windows 是脚本的第一目标平台（SKILL.md 明说 Windows 优先），但此前 CI 只有 ubuntu——
  # 路径分隔符、控制台编码、cmd/&&、Playwright 浏览器回退这些 Windows 专属问题从未进过 CI。
  # 这条 job 用真流程（两轮 pipeline + check）在 windows-latest 上跑一遍，不做负向测试以控制时长。
  fixture-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 装脚本依赖（含 Chromium）
        working-directory: fandex/skills/fandex/scripts
        run: |
          npm ci
          npx playwright install chromium
      - name: 装字体子集工具
        run: python -m pip install fonttools brotli
      - name: 准备 fixture 项目根（含程序生成的测试字体）
        run: |
          $SKILL = Join-Path $PWD "fandex/skills/fandex"
          $ROOT = Join-Path $env:RUNNER_TEMP "acb-eval-win"
          if (Test-Path $ROOT) { Remove-Item $ROOT -Recurse -Force }
          New-Item -ItemType Directory -Path $ROOT | Out-Null
          Copy-Item -Path (Join-Path $SKILL "evals/fixture/*") -Destination $ROOT -Recurse -Force
          python (Join-Path $SKILL "evals/make_smoke_font.py") (Join-Path $ROOT "fonts")
          if ($LASTEXITCODE -ne 0) { throw "make_smoke_font 失败" }
          Write-Host "fixture root: $ROOT"
      - name: 两轮 pipeline + check（Windows 主目标平台）
        working-directory: fandex/skills/fandex/scripts
        env:
          ANIME_BOOK_ROOT: ${{ runner.temp }}\acb-eval-win
          ANIME_BOOK_FONT_REGULAR: ${{ runner.temp }}\acb-eval-win\fonts\Smoke-Regular.ttf
          ANIME_BOOK_FONT_MEDIUM: ${{ runner.temp }}\acb-eval-win\fonts\Smoke-Medium.ttf
          ANIME_BOOK_TITLE: 测试收藏册
        run: |
          node names_to_base.js
          if ($LASTEXITCODE -ne 0) { exit 1 }
          npm run pipeline
          if ($LASTEXITCODE -ne 0) { exit 1 }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          npm run audit
          Write-Host "✓ Windows fixture：两轮 pipeline 收敛、check 全绿（18 条）"
